services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motivasyondefteri}
      POSTGRES_USER: ${POSTGRES_USER:-motivasyon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - motivasyondefteri_pgdata:/var/lib/postgresql/data

  api:
    build: ./backend/Crm.Api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${DB_CONNECTION}
      Auth__Username: ${AUTH_USERNAME:-admin}
      Auth__Password: ${AUTH_PASSWORD:-admin123}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.motivasyondefteri-api.rule=Host(`salesapi.medigoport.com`)"
      - "traefik.http.routers.motivasyondefteri-api.entrypoints=web"
      - "traefik.http.routers.motivasyondefteri-api.service=motivasyondefteri-api"

      - "traefik.http.routers.motivasyondefteri-api-secure.rule=Host(`salesapi.medigoport.com`)"
      - "traefik.http.routers.motivasyondefteri-api-secure.entrypoints=websecure"
      - "traefik.http.routers.motivasyondefteri-api-secure.tls=true"
      - "traefik.http.routers.motivasyondefteri-api-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.motivasyondefteri-api-secure.service=motivasyondefteri-api"

      - "traefik.http.services.motivasyondefteri-api.loadbalancer.server.port=5080"
    networks:
      - proxy
      - default

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://salesapi.medigoport.com}
    restart: unless-stopped
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.motivasyondefteri-web.rule=Host(`sales.medigoport.com`)"
      - "traefik.http.routers.motivasyondefteri-web.entrypoints=web"
      - "traefik.http.routers.motivasyondefteri-web.service=motivasyondefteri-web"

      - "traefik.http.routers.motivasyondefteri-web-secure.rule=Host(`sales.medigoport.com`)"
      - "traefik.http.routers.motivasyondefteri-web-secure.entrypoints=websecure"
      - "traefik.http.routers.motivasyondefteri-web-secure.tls=true"
      - "traefik.http.routers.motivasyondefteri-web-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.motivasyondefteri-web-secure.service=motivasyondefteri-web"

      - "traefik.http.services.motivasyondefteri-web.loadbalancer.server.port=80"
    networks:
      - proxy
      - default

networks:
  proxy:
    external: true

volumes:
  motivasyondefteri_pgdata:
