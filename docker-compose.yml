services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motivasyondefteri}
      POSTGRES_USER: ${POSTGRES_USER:-motivasyon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - motivasyondefteri_pgdata:/var/lib/postgresql/data

  api:
    build: ./backend/Crm.Api
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "5080:5080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${DB_CONNECTION}
      Auth__Username: ${AUTH_USERNAME:-admin}
      Auth__Password: ${AUTH_PASSWORD:-admin123}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  motivasyondefteri_pgdata:
